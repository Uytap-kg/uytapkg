# ==============================================================================
# UyTap.kg — Docker Compose Production Configuration (deploy/docker-compose.yml)
# ==============================================================================
# Альтернатива PM2 при контейнерном деплое на один VPS.
# Задаёт лимиты памяти и CPU, ротацию логов (чтобы не переполнить диск при всплесках),
# таймаут stop_grace_period: 30s для корректного gracefulShutdown и healthchecks.
# ==============================================================================

services:
  backend:
    build:
      context: ../back-end
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ../back-end/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_POOL_MAX: 10
      DB_STATEMENT_TIMEOUT_MS: 15000
    ports:
      - "127.0.0.1:5000:5000"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ../front-end
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - ../front-end/.env.local
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
