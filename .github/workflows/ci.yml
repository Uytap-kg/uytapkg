name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-audit:
    name: Lint & Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.1.0
        with:
          node-version-file: ".nvmrc"

      # --- Backend Checks ---
      - name: Cache backend dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-backend-npm-${{ hashFiles('back-end/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-npm-

      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci

      - name: Check backend syntax (Lint)
        working-directory: back-end
        run: npm run lint

      - name: Audit backend dependencies (high+)
        working-directory: back-end
        run: npm audit --omit=dev --audit-level=high

      # --- Frontend Checks ---
      - name: Cache frontend dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('front-end/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci

      - name: Run frontend ESLint
        working-directory: front-end
        run: npm run lint

      - name: Audit frontend dependencies (high+)
        working-directory: front-end
        run: npm audit --omit=dev --audit-level=high

  backend-tests:
    name: Backend Unit & Security Tests
    needs: lint-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Cache backend dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-backend-npm-${{ hashFiles('back-end/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-npm-

      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci

      - name: Run backend test suite with coverage
        working-directory: back-end
        env:
          NODE_ENV: test
          PORT: 5000
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_KEY: dummy-test-service-role-key-for-unit-tests
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          JWT_SECRET: dummy-test-jwt-secret-at-least-32-chars-long
          OTP_SECRET: dummy-test-otp-secret-at-least-32-chars-long
        run: |
          npm run test:coverage 2>&1 | tee test-results.log

      - name: Upload backend test results artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: backend-test-results
          path: back-end/test-results.log
          retention-days: 14

  build-frontend:
    name: Frontend Production Build Verification
    needs: lint-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Cache frontend dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('front-end/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-npm-

      - name: Cache Next.js build cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: front-end/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('front-end/package-lock.json') }}-${{ hashFiles('front-end/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('front-end/package-lock.json') }}-

      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci

      - name: Build Next.js application
        working-directory: front-end
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
        run: npm run build

  build-and-scan-docker:
    name: Backend Docker Build & Vulnerability Scan
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Backend Docker image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: back-end
          file: back-end/Dockerfile
          push: false
          load: true
          tags: uytap-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan on image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uytap-backend:ci-${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

  test-db-migrations:
    name: Clean DB Migrations Verification
    needs: lint-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_uytap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Cache backend dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-backend-npm-${{ hashFiles('back-end/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-npm-

      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci

      - name: Run migrations on clean database
        working-directory: back-end
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_uytap
          NODE_ENV: test
        run: npm run migrate

      - name: Verify migration idempotency (run second time)
        working-directory: back-end
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_uytap
          NODE_ENV: test
        run: npm run migrate

  deploy-to-render:
    name: Trigger Render Production Deploy
    needs: [lint-and-audit, backend-tests, test-db-migrations, build-frontend, build-and-scan-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}

    steps:
      - name: Trigger Backend Deploy Hook
        if: env.RENDER_BACKEND_DEPLOY_HOOK != ''
        run: |
          echo "Triggering backend deploy hook..."
          curl -fsS -X POST "$RENDER_BACKEND_DEPLOY_HOOK"

      - name: Trigger Frontend Deploy Hook
        if: env.RENDER_FRONTEND_DEPLOY_HOOK != ''
        run: |
          echo "Triggering frontend deploy hook..."
          curl -fsS -X POST "$RENDER_FRONTEND_DEPLOY_HOOK"
