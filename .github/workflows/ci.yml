name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-ci:
    name: Backend Test & Security Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back-end

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: back-end/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Dependency vulnerability audit (high+)
        run: npm audit --omit=dev --audit-level=high
